trigger: none

pool:
  name: 'Default'

variables:
  webAppName: 'webapp-$(Build.BuildId)'
  resourceGroupName: 'techish-webapp-rg'
  location: 'centralindia'
  postgresServerName: 'webapp-postgres'
  databaseName: 'webappdb'
  adminUsername: '$(DBuser)'
  adminPassword: '$(DBPASS)'  # Set in pipeline variables

stages:
- stage: Setup
  jobs:
  - job: InstallDependencies
    displayName: 'Install Required Utilities'
    steps:
    - script: sudo apt-get update
      displayName: 'Update package list'
    - script: sudo apt-get install -y curl gnupg zip wget software-properties-common
      displayName: 'Install basic utilities'
    - script: |
        if ! command -v node &> /dev/null || ! command -v npm &> /dev/null; then
          echo "Installing Node.js 18..."
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
        else
          echo "Node.js and npm are already installed"
        fi
      displayName: 'Check and Install Node.js 18'
    - script: |
        if ! command -v az &> /dev/null; then
          echo "Installing Azure CLI..."
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        else
          echo "Azure CLI is already installed"
        fi
      displayName: 'Check and Install Azure CLI'
    - script: |
        if ! command -v psql &> /dev/null; then
          echo "Installing PostgreSQL Client..."
          sudo apt-get install -y postgresql-client
        else
          echo "PostgreSQL client is already installed"
        fi
      displayName: 'Check and Install PostgreSQL Client'
    - script: |
        if ! command -v terraform &> /dev/null; then
          echo "Installing Terraform..."
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com jammy main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y terraform
        else
          echo "Terraform is already installed"
        fi
      displayName: 'Check and Install Terraform'

- stage: Infrastructure
  dependsOn: Setup
  jobs:
  - job: DeployInfra
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'azure-sp'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          RESOURCE_GROUP='techish-webapp-rg'
          STORAGE_ACCOUNT='techishtfstorage'
          CONTAINER_NAME='tfstate'
          
          # Check if resource group exists, create if not
          if ! az group exists --name $RESOURCE_GROUP | grep -q true; then
            echo "Creating resource group: $RESOURCE_GROUP"
            az group create --name $RESOURCE_GROUP --location centralindia
          else
            echo "Resource group $RESOURCE_GROUP already exists"
          fi
          
          # Check if storage account exists, create if not
          if ! az storage account show --name $STORAGE_ACCOUNT --resource-group $RESOURCE_GROUP 2>/dev/null; then
            echo "Creating storage account: $STORAGE_ACCOUNT"
            az storage account create --name $STORAGE_ACCOUNT --resource-group $RESOURCE_GROUP --location centralindia --sku Standard_LRS
          else
            echo "Storage account $STORAGE_ACCOUNT already exists"
          fi
          
          # Get storage account key
          STORAGE_KEY=$(az storage account keys list --account-name $STORAGE_ACCOUNT --resource-group $RESOURCE_GROUP --query '[0].value' -o tsv)
          
          # Check if container exists, create if not
          if ! az storage container exists --name $CONTAINER_NAME --account-name $STORAGE_ACCOUNT --account-key $STORAGE_KEY | grep -q '"exists": true'; then
            echo "Creating storage container: $CONTAINER_NAME"
            az storage container create --name $CONTAINER_NAME --account-name $STORAGE_ACCOUNT --account-key $STORAGE_KEY
          else
            echo "Storage container $CONTAINER_NAME already exists"
          fi
      displayName: 'Check and Create Terraform Backend'
    - task: TerraformTaskV2@2
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: 'infra'
        backendServiceArm: 'azure-sp'
        backendAzureRmResourceGroupName: 'techish-webapp-rg'
        backendAzureRmStorageAccountName: 'techishtfstorage'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'techishprod.tfstate'
    - task: TerraformTaskV2@2
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: 'infra'
        environmentServiceNameAzureRM: 'azure-sp'
        commandOptions: '-input=false -var="admin_username=$(DBuser)" -var="admin_password=$(DBPASS)"'
        runAzLogin: true
    - task: TerraformTaskV2@2
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: 'infra'
        environmentServiceNameAzureRM: 'azure-sp'
        commandOptions: '-input=false -var="admin_username=$(DBuser)" -var="admin_password=$(DBPASS)"'
    - script: |
        echo "Waiting for PostgreSQL server to be fully provisioned..."
        sleep 10
        echo "PostgreSQL server provisioning complete"
      displayName: 'Wait for PostgreSQL Server'

- stage: Database
  dependsOn: Infrastructure
  jobs:
    - job: SetupDB
      displayName: Setup PostgreSQL DB
      steps:
        - task: AzureCLI@2
          displayName: Run DB setup script
          inputs:
            azureSubscription: 'azure-sp'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              set -e

              # Retry config
              CONN_RETRIES=5
              CONN_COUNT=0

              DB_USER="$DB_USER"
              DB_PASS="$DB_PASS"
              DB_HOST="$DB_HOST"
              DB_NAME="$DB_NAME"

              # Retry loop
              while [ $CONN_COUNT -lt $CONN_RETRIES ]; do
                echo "Attempt $((CONN_COUNT + 1))/$CONN_RETRIES..."

                if PGPASSWORD="$DB_PASS" psql \
                  -h "$DB_HOST" \
                  -U "$DB_USER" \
                  -d "$DB_NAME" \
                  -c "SELECT 1;" -v ON_ERROR_STOP=1; then
                  
                  echo "✅ Connection successful"
                  break
                fi

                CONN_COUNT=$((CONN_COUNT + 1))

                if [ $CONN_COUNT -lt $CONN_RETRIES ]; then
                  echo "Retrying in 5 seconds..."
                  sleep 5
                fi
              done

              if [ $CONN_COUNT -eq $CONN_RETRIES ]; then
                echo "❌ Failed to connect after $CONN_RETRIES attempts"
                exit 1
              fi

              echo "Applying schema..."

              PGPASSWORD="$DB_PASS" psql \
                -h "$DB_HOST" \
                -U "$DB_USER" \
                -d "$DB_NAME" \
                -f db/schema.sql

              echo "✅ Database setup completed"

          env:
            DB_USER: $(DBuser)
            DB_PASS: $(DBpass)
            DB_HOST: $(postgresServerName).postgres.database.azure.com
            DB_NAME: $(databaseName)

- stage: WebApp
  dependsOn: Database
  jobs:
  - job: DeployWebApp
    steps:
    - script: npm install
      workingDirectory: webapp
    - script: node -e "console.log('##vso[task.setvariable variable=sonarProjectKey]' + require('crypto').randomUUID())"
      displayName: 'Generate Sonar Project GUID'
    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarCloud analysis'
      inputs:
        SonarCloud: 'sonar-connection'
        organization: 'techishprod'
        scannerMode: 'CLI'
        projectKey: $(sonarProjectKey)
        projectName: 'webappwithdbonazure'
        extraProperties: |
          sonar.sources=webapp
          sonar.tests=webapp
          sonar.test.inclusions=**/*.test.js
          sonar.javascript.lcov.reportPaths=webapp/coverage/lcov.info
      
    - script: npm test
      workingDirectory: webapp
      displayName: 'Run Unit Tests'
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'webapp'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/webapp.zip'
        replaceExistingArchive: true
      displayName: 'Archive WebApp'
    - task: SonarCloudAnalyze@4
      displayName: 'Run SonarCloud analysis'
    - task: SonarCloudPublish@4
      displayName: 'Publish Quality Gate Result'
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'webapp'
        publishLocation: 'Container'
      condition: eq(variables['SonarCloudQualityGatePassed'], 'True')
      displayName: 'Publish Artifact'
    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'azure-sp'
        appType: 'webAppLinux'
        appName: $(webAppName)
        package: '$(Build.ArtifactStagingDirectory)/webapp.zip'
        runtimeStack: 'NODE|18-lts'
        appSettings: |
          DATABASE_URL=postgresql://$(DBuser)@$(postgresServerName):$(DBPASS)@$(postgresServerName).postgres.database.azure.com:5432/$(databaseName)?sslmode=require
      condition: eq(variables['SonarCloudQualityGatePassed'], 'True')
      displayName: 'Deploy to Azure Web App'

- stage: Selenium
  dependsOn: WebApp
  jobs:
  - job: RunTests
    steps:
    - script: npm install
      workingDirectory: tests
    - script: npm test
      workingDirectory: tests
      env:
        APP_URL: 'https://$(webAppName).azurewebsites.net'